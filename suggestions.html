<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbi Suggestions</title>
    <style>
        body {
            margin: 0;
            background-color: #0a1a2f;
            font-family: Arial, sans-serif;
            color: white;
            padding: 40px;
        }
        img {
            width: 130px;
            display: block;
            margin: 0 auto 20px auto;
        }
        form {
            max-width: 400px;
            margin: auto;
            background: rgba(255,255,255,0.07);
            padding: 20px;
            border-radius: 10px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 6px;
            border: none;
            margin-top: 10px;
            resize: none;
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #1da1f2;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <img src="orbi.jpeg" alt="Orbi logo">

    <h2 style="text-align:center;">We’d Love Your Feedback</h2>

    <form action="thankyou.html">
        <label>Your Suggestion:</label>
        <textarea required></textarea>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
